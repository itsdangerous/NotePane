<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 180" role="img" aria-labelledby="title desc">
  <title id="title">NotePane wordmark</title>
  <desc id="desc">A soft geometric NotePane wordmark with a pastel pane mark.</desc>
  <defs>
    <linearGradient id="paneFront" x1="42" y1="30" x2="132" y2="126" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf7"/>
      <stop offset="1" stop-color="#e9e0d4"/>
    </linearGradient>
    <linearGradient id="paneGreen" x1="62" y1="48" x2="154" y2="142" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff8e8"/>
      <stop offset="1" stop-color="#c7ddba"/>
    </linearGradient>
    <linearGradient id="paneBlue" x1="82" y1="64" x2="176" y2="154" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eef8ff"/>
      <stop offset="1" stop-color="#c5deed"/>
    </linearGradient>
    <filter id="paneShadow" x="-35%" y="-35%" width="170%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#211d17" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#211d17" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#paneShadow)">
    <rect x="82" y="62" width="112" height="82" rx="18" fill="url(#paneBlue)"/>
    <rect x="62" y="46" width="112" height="82" rx="18" fill="url(#paneGreen)"/>
    <rect x="42" y="30" width="112" height="82" rx="18" fill="url(#paneFront)" stroke="#d2c9bd" stroke-width="2"/>
    <rect x="58" y="48" width="12" height="12" rx="6" fill="#c8c1b8"/>
    <rect x="80" y="48" width="12" height="12" rx="6" fill="#c8c1b8"/>
    <rect x="102" y="48" width="12" height="12" rx="6" fill="#c8c1b8"/>
  </g>

  <text
    x="230"
    y="116"
    fill="#2f3437"
    font-family="Inter, SF Pro Display, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    font-size="74"
    font-weight="780"
    letter-spacing="-4"
  >Note<tspan fill="#789b71">Pane</tspan></text>
  <path d="M232 136H560" stroke="#d9ecf8" stroke-width="10" stroke-linecap="round" opacity="0.72"/>
</svg>

appId: com.gyu.notepane
productName: NotePane
directories:
  output: release
files:
  - dist/**/*
  - electron/**/*
  - build/**/*
  - package.json
mac:
  icon: build/icon.icns
  category: public.app-category.productivity
  target:
    - target: zip
      arch:
        - arm64
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
asar: true
